<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Portfolio</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">CITERNE Kanae</h1>
      <nav class="main-nav">
        <a href="index.html">Accueil</a>
        <a href="about.html">À propos</a>
        <a href="projects.html">Projets</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button id="menu-toggle" class="menu-toggle">☰</button>
    </div>
  </header>

  <main class="container" style="padding-top:1rem">
    <section class="card">
      <h2>Contact</h2>
      <p>Vous pouvez me contacter via le formulaire ci-dessous (statique) ou par email à l'adresse <a href="mailto:kanae.citerne@outlook.fr">kanae.citerne@outlook.fr</a>.</p>

      <form action="mailto:kanae.citerne@outlook.fr" method="post" enctype="text/plain">
        <label for="name">Nom</label>
        <input id="name" name="name" type="text" style="width:100%;margin:.5rem 0;padding:.5rem;border-radius:6px;border:1px solid rgba(255,255,255,.04);background:transparent;color:var(--text)" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" style="width:100%;margin:.5rem 0;padding:.5rem;border-radius:6px;border:1px solid rgba(255,255,255,.04);background:transparent;color:var(--text)" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" style="width:100%;margin:.5rem 0;padding:.5rem;border-radius:6px;border:1px solid rgba(255,255,255,.04);background:transparent;color:var(--text)"></textarea>

        <p><button class="btn" type="submit">Envoyer</button></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
    <p>© 2026 — CITERNE Kanae. Tous droits réservés.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
